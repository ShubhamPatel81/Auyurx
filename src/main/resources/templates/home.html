<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auyurx Home</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-green-600 p-4">
    <div class="container mx-auto flex justify-between items-center">

        <h1 class="text-white text-xl font-bold">
            AUYURX
        </h1>

        <div class="space-x-4">
            <a th:href="@{/login}" class="text-white hover:underline">Login</a>
            <a th:href="@{/register}" class="bg-white text-green-600 px-4 py-2 rounded hover:bg-gray-200">Register</a>
        </div>

    </div>
</nav>


<!-- Hero Section -->
<div class="flex items-center justify-center h-screen">

    <div class="text-center">

        <h2 class="text-4xl font-bold text-gray-800 mb-6">
            Welcome to AUYURX
        </h2>

        <p class="text-gray-600 mb-8">
            Secure health platform for modern users
        </p>

        <div class="space-x-4">

            <a th:href="@{/login}"
               class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700">
                Login
            </a>

            <a th:href="@{/register}"
               class="bg-gray-800 text-white px-6 py-3 rounded-lg hover:bg-gray-900">
                Register
            </a>

        </div>

    </div>

</div>

</body>
</html>
